name: CPU regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-test.txt
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libgl1 libegl1 libxkbcommon-x11-0 fonts-noto-cjk
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip check
      - name: Compile and check CLI
        run: |
          python -m compileall -q src tools pingpong.py
          python pingpong.py --help
      - name: Test algorithms, tracking, GUI and artifact recovery
        run: python -m pytest -q --junitxml=output/ci-tests.xml
