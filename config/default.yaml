cameras:
  master_serial: DSP01F1FFF59
  slave_serial: DSP01F1FFF3E
  width: 1280
  height: 720
  timestamp_correction_us:
    master: 0
    slave: 0

events:
  window_us: 5000
  step_us: 2500
  sae_tau_us: 2500
  max_event_rate_mevs: 5
  contrast_bias: 20
  trail_filter_ms: 10
  anti_flicker: true

detection:
  type: hough_circle
  interval_us: 2500
  threshold_percentile: 99.4
  minimum_threshold: 18
  min_radius_px: 12
  max_radius_px: 120
  min_area_px: 30
  max_area_px: 50000
  max_aspect_ratio: 4.0
  roi_half_size_px: 140
  max_missed_windows: 12
  hough_scale: 0.5
  hough_min_distance_px: 20
  hough_canny_threshold: 60
  hough_vote_threshold: 15
  maximum_candidates: 40
  minimum_ring_score: 0.08
  predictive_refinement: true
  predictive_min_ring_score: 0.045
  predictive_fallback_hough: false

stereo:
  calibration_file: calibration/stereo_calibration.npz
  calibration_pattern: led-circles-3x4
  calibration_spacing_x_mm: 50.0
  calibration_spacing_y_mm: 50.0
  max_epipolar_error_px: 4.0
  max_radius_ratio: 2.0
  ball_radius_m: 0.020
  minimum_depth_m: 0.3
  maximum_depth_m: 3.0
  max_radius_scale_error: 0.8
  maximum_prediction_error_px: 60.0
  maximum_ball_speed_mps: 30.0
  position_jump_allowance_m: 0.02
  continuity_reset_s: 0.05
  max_reprojection_error_px: 3.0

trajectory:
  # 需在桌面外参标定后才能填写真实重力方向；当前相机坐标先用常速度模型。
  gravity_vector_camera_mps2: [0.0, 0.0, 0.0]
  gravity_mps2: 9.80665
  drag_coefficient: 0.0
  process_noise: 0.08
  measurement_noise_m: 0.01

spin:
  enabled: true
  # 检测使用较长事件窗；转速只保留最近 1 ms，并按球心速度做平移补偿。
  window_us: 1000
  sae_tau_us: 500
  normalized_patch_size: 128
  # 相似圆点的身份会歧义；有唯一尺寸/已知布局的球再启用（建议值 3）。
  minimum_dot_features: 99
  maximum_dots: 16
  dot_min_radius_px: 2
  dot_max_radius_px: 14
  dot_min_distance_px: 7
  dot_canny_threshold: 35
  dot_vote_threshold: 6
  dot_max_motion_px: 28
  dot_max_radius_ratio: 2.0
  minimum_features: 4
  maximum_features: 30
  minimum_radius_px: 7
  max_forward_backward_error_px: 1.5
  max_lk_error: 30.0
  minimum_quality: 0.15
  minimum_fused_quality: 0.15
  maximum_relative_disagreement: 0.5
  max_rpm: 12000

output:
  preview_fps: 50
  preview_scale: 0.5

runtime:
  opencv_threads: 1
  parallel_cameras: false
