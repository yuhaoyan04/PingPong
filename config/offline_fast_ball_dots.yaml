# Offline truth-oriented profile for a real serve.  A 1 ms window limits
# translational blur to roughly 20 px at 5 m/s in the current narrow FOV.
cameras:
  master_serial: DSP01F1FFF59
  slave_serial: DSP01F1FFF3E
  width: 1280
  height: 720
  timestamp_correction_us: {master: 0, slave: 0}
events: {window_us: 1000, step_us: 1000, sae_tau_us: 500}
detection:
  type: hough_circle
  interval_us: 1000
  threshold_percentile: 99.2
  minimum_threshold: 10
  min_radius_px: 12
  max_radius_px: 120
  min_area_px: 20
  max_area_px: 50000
  max_aspect_ratio: 4.0
  roi_half_size_px: 180
  max_missed_windows: 5
  hough_scale: 0.5
  hough_min_distance_px: 20
  hough_canny_threshold: 35
  hough_vote_threshold: 9
  maximum_candidates: 30
  minimum_ring_score: 0.035
  predictive_refinement: true
  predictive_min_ring_score: 0.02
  predictive_fallback_hough: true
stereo:
  calibration_file: calibration/stereo_calibration.npz
  max_epipolar_error_px: 4.0
  max_radius_ratio: 2.0
  ball_radius_m: 0.020
  minimum_depth_m: 0.3
  maximum_depth_m: 3.0
  max_radius_scale_error: 0.8
  maximum_prediction_error_px: 100.0
  maximum_ball_speed_mps: 30.0
  position_jump_allowance_m: 0.03
  continuity_reset_s: 0.03
  max_reprojection_error_px: 3.0
trajectory:
  gravity_vector_camera_mps2: [0.0, 0.0, 0.0]
  gravity_mps2: 9.80665
  drag_coefficient: 0.0
  process_noise: 0.08
  measurement_noise_m: 0.006
spin:
  enabled: true
  solver: rigid_rotation
  rotation_inlier_threshold_rad: 0.04
  window_us: 1000
  sae_tau_us: 500
  normalized_patch_size: 96
  minimum_dot_features: 3
  maximum_dots: 12
  dot_min_radius_px: 2
  dot_max_radius_px: 14
  dot_min_distance_px: 6
  dot_canny_threshold: 25
  dot_vote_threshold: 8
  dot_max_motion_px: 15
  dot_max_radius_ratio: 1.6
  minimum_features: 8
  maximum_features: 100
  lk_window_px: 15
  lk_pyramid_levels: 2
  minimum_radius_px: 12
  max_forward_backward_error_px: 1.2
  max_lk_error: 30.0
  minimum_quality: 0.10
  minimum_fused_quality: 0.12
  maximum_relative_disagreement: 0.5
  max_rpm: 12000
output: {preview_fps: 100, preview_scale: 0.5}
runtime: {opencv_threads: 1, parallel_cameras: false}
