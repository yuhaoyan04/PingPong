cameras:
  master_serial: DSP01F1FFF59
  slave_serial: DSP01F1FFF3E
  width: 1280
  height: 720
  timestamp_correction_us: {master: 0, slave: 0}
events:
  window_us: 2000
  step_us: 2000
  sae_tau_us: 900
detection:
  type: hough_circle
  search_roi: [620, 0, 1280, 240]
  interval_us: 2000
  threshold_percentile: 99.2
  minimum_threshold: 10
  min_radius_px: 35
  max_radius_px: 75
  min_area_px: 20
  max_area_px: 30000
  max_aspect_ratio: 4.0
  roi_half_size_px: 100
  max_missed_windows: 25
  hough_scale: 0.5
  hough_min_distance_px: 30
  hough_canny_threshold: 35
  hough_vote_threshold: 9
  maximum_candidates: 15
  minimum_ring_score: 0.03
  hough_refine_candidates: true
  hough_refine_limit: 3
  predictive_refinement: true
  normalized_roi_scale: 1.7
  predictive_search_px: 12
  predictive_search_step_px: 4
  predictive_radius_search_px: 4
  predictive_radius_step_px: 4
  predictive_min_ring_score: 0.018
  predictive_candidates: 3
  predictive_nms_px: 4
  predictive_ring_samples: 48
  predictive_refine_candidates: false
  predictive_fallback_hough: true
  bootstrap_detector_type: hough
  bootstrap_min_score: 0.82
  bootstrap_min_radius_px: 44
  bootstrap_interval_us: 10000
  bootstrap_min_roi_events: 250
  bootstrap_burst_roi_events: 1000
  bootstrap_max_epipolar_error_px: 8.0
stereo:
  calibration_file: calibration/stereo_calibration.npz
  max_epipolar_error_px: 5.0
  max_radius_ratio: 1.8
  ball_radius_m: 0.020
  minimum_depth_m: 0.5
  maximum_depth_m: 1.5
  max_radius_scale_error: 0.55
  maximum_prediction_error_px: 60.0
  maximum_ball_speed_mps: 15.0
  position_jump_allowance_m: 0.02
  continuity_reset_s: 0.04
  max_reprojection_error_px: 3.5
trajectory:
  gravity_vector_camera_mps2: [0.0, 0.0, 0.0]
  gravity_mps2: 9.80665
  drag_coefficient: 0.0
  process_noise: 0.08
  measurement_noise_m: 0.006
spin: {enabled: false, normalized_patch_size: 96}
template_spin:
  window_us: 2000
  tau_us: 1000
  patch_size: 64
  normalized_patch_size: 64
  pose_window_us: 30000
  spin_update_interval_us: 5000
  reset_gap_us: 6000
  minimum_markers: 4
  signature_tolerance: 0.12
  template_inlier_chord: 0.12
  ball_radius_m: 0.020
  maximum_reprojection_px: 3.0
  maximum_shell_error_m: 0.006
  guided_marker_gate_px: 6.0
  guided_direction_chord: 0.15
  acquisition_pose_hypotheses: 30
  acquisition_marker_gate_px: 4.0
  initial_pairs_per_left: 3
  initial_pairs_per_right: 3
  dot_detector: blobs
  maximum_dots: 18
  dot_blob_threshold: 20
  dot_mask_radius_fraction: 0.72
  dot_blob_close_px: 1
  dot_blob_min_area_px: 2
  dot_blob_max_area_px: 100
  dot_blob_max_aspect_ratio: 5.0
output: {preview_fps: 100, preview_scale: 0.5}
runtime: {opencv_threads: 1, parallel_cameras: false}
